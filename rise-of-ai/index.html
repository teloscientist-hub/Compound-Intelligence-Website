<style>
  :root { --bg:#0b0e14; --panel:#131824; --ink:#e8e6df; --dim:#8a92a6;
          --accent:#e0a83c; --tick:#3a4356; --tickon:#e0a83c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink);
         font:16px/1.55 Georgia, 'Times New Roman', serif;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; }

  header h1 { font-size:18px; letter-spacing:.14em; color:var(--dim);
              font-weight:normal; text-transform:uppercase; }
  #stage { width:min(960px, 96vw); }
  #imgwrap { background:#000; border-radius:6px; overflow:hidden;
             aspect-ratio:16/9; display:flex; align-items:center;
             justify-content:center; margin-top:10px; }
  #imgwrap img { width:100%; height:100%; object-fit:contain; }
  #imgwrap .noimg { color:var(--dim); font-style:italic; }
  #datebar { display:flex; align-items:baseline; justify-content:space-between;
             margin:10px 2px 2px; }

  #slidetitle { font-size:15px; color:var(--dim); text-align:right; }
  /* timeline strip */
  #strip { position:relative; height:56px; margin:4px 0 6px; cursor:pointer; }
  #strip .rail { position:absolute; left:0; right:0; top:26px; height:2px;
                 background:var(--tick); }
  .tick { position:absolute; top:18px; width:2px; height:18px;
          background:var(--tick); cursor:pointer; }
  .tick.dated { background:#5a6478; }
  .tick.on { background:var(--tickon); width:4px; top:12px; height:30px; }
  .tick .lbl { position:absolute; top:34px; left:50%; transform:translateX(-50%);
               font-size:10px; color:var(--dim); white-space:nowrap; display:none; }
  .tick.on .lbl { display:block; color:var(--accent); }
  .tick .dec { position:absolute; top:-2px; left:50%; transform:translateX(-50%);
               font-size:10px; color:var(--dim); white-space:nowrap;
               font-family:Helvetica, Arial, sans-serif; letter-spacing:.06em; }
  /* story */
  #story { background:var(--panel); border-radius:6px; padding:20px 24px 16px;
           margin:8px 0 14px; min-height:180px; }
  #story h2 { font-size:20px; margin-bottom:10px; color:var(--ink); }
  #story .fld { margin:0 0 10px; }
  #story .fld b { color:var(--accent); font-size:11px; letter-spacing:.12em;

  /* nav */
  #nav { display:flex; gap:10px; justify-content:center; margin:2px 0 6px; }
  #stage { padding-bottom:26px; }
  #nav button { background:var(--panel); color:var(--ink); border:1px solid var(--tick);
                border-radius:6px; padding:8px 22px; font-size:15px; cursor:pointer; }
  #nav button:hover { border-color:var(--accent); }
  #pos { color:var(--dim); align-self:center; font-size:13px;
         font-variant-numeric:tabular-nums; }

<script>
const SLIDES = [{"beat": "BOOKEND", "title": "BOOKEND OPEN · Optimus J5, sternum-up → half-shoulders-up, slow push", "ch": "BOOKEND", "start": "0:00.000", "date": "", "status": "", "img": "stills/_index_thumbs/BOOKEND.jpg", "fields": {"DATE": "None – this is the film's final frame, shown before the story starts.", "WHAT": "Optimus, sternum-up, in the exact composition every human portrait in the film will use: the machine's place at the desk, facing the lens.", "WHERE": "The J5 room – the film's one recurring stage, whose occupants change across ninety years while the framing never does.", "WHAT WAS NEW": "Nothing yet – that is the point. The film opens on its conclusion, so every fact that follows is the explanation of this image.", "STAKES": "The whole story, compressed: before a single human appears, the chair is already occupied by the machine.", "THREAD": "The first occupant of this composition is not a hero but an enemy – a German signals officer at a cipher machine. → C1.1", "ON SCREEN": "AI-generated. Optimus against a night-lit Earth, pushing slowly closer. A viewer who remembers this frame will recognise the film's last shot as the same image and understand the story as a closed loop."}, "heading": "the end, shown first"}, {"beat": "C1.1", "title": "ENIGMA [J5]", "ch": "THE CODEBREAKERS", "start": "0:03.290", "date": "1932", "status": "V", "img": "stills/_index_thumbs/C1_1.jpg", "fields": {"DATE": "1932 – the Wehrmacht Enigma I (the commercial Enigma D with a plugboard added) enters German Army service. The commercial machine had been sold openly since 1923. In the same year, December 1932, the Polish Cipher Bureau achieved the first breaks – a fight that began the moment the machine did.", "WHAT": "The Enigma – a portable electromechanical rotor cipher machine. Press a key and current runs through the plugboard, through three rotors, off a reflector and back, and a lamp lights: that lamp is the enciphered letter. The rightmost rotor steps with every keypress, so the machine never enciphers two letters the same way in a row.", "WHERE": "The standard cipher of the German armed forces – army, air force, and in its hardest variant the U-boat fleet. Tens of thousands of machines, from field posts to submarines.", "WHAT WAS NEW": "A cipher that changes with every single letter, produced at industrial speed by a box you can carry. Rotor order, ring settings, plugboard pairs and start position were reset daily from printed key sheets – the commonly cited count is about 1.6 × 10²⁰ possible daily settings. Pencil-and-paper cryptanalysis cannot keep pace with a machine; for the first time, breaking a cipher would require building a machine.", "STAKES": "Every U-boat order, every army movement, every Luftwaffe instruction passed through this box. Germany bet its communications on it being unbreakable.", "THREAD": "The traffic streamed out over radio in Morse, and Britain was listening. The intercepts went to a Victorian estate north of London – where, in September 1939, Alan Turing reported for duty. → C1.2", "ON SCREEN": "AI-generated recreation. A Wehrmacht operator, gloved hand on the keys, one lamp answering cold white. The wall poster reads \"DER SIEG WIRD UNSER SEIN!\" – \"Victory will be ours!\" Caveat for captioning: the recreation's lampboard letters run in near-alphabetical order; a real Enigma's rows ran QWERTZUIO. The gloved hand and the lit lamp are the historically real grammar: press → answer."}, "heading": "ENIGMA · 1932"}, {"beat": "C1.2", "title": "BLETCHLEY · Turing, Hut 8", "ch": "THE CODEBREAKERS", "start": "0:05.124", "date": "Sep 1939", "status": "V", "img": "stills/_index_thumbs/C1_2.jpg", "fields": {"DATE": "September 1939 – Britain declares war on 3 September; Turing reports to Bletchley Park that same week.", "WHAT": "The Government Code & Cypher School at Bletchley Park: mathematicians, linguists, chess champions and crossword winners recruited into huts on a country estate. Turing joins the naval Enigma problem – the U-boat traffic, worked in Hut 8.", "WHERE": "Bletchley Park, Buckinghamshire, north of London.", "WHAT WAS NEW": "Codebreaking industrialised. Not a lone genius over a candle – an assembly line of intercept slips, card indexes and shift work, growing into a secret town. And at its centre, a new kind of recruit: the mathematician, because the enemy was now a machine.", "STAKES": "Britain imported almost everything it ate and burned. The U-boats were sinking ships faster than yards could build them, and every convoy's routing order was readable only if Enigma was. Losing the Atlantic meant losing the war before America entered it.", "THREAD": "The hut could not out-write a machine that changed its cipher with every keystroke. Turing's answer was to fight the machine with a machine – and its heart would be a drum that imitated the enemy's rotor. → C1.4", "ON SCREEN": "AI-generated recreation. Turing standing still in a hut of urgent motion – Wrens writing, papers stacking – beneath a wall chart reading \"ATLANTIC CONVOY MAP\" with the convoy lanes and loss markers. The stillness inside the urgency is the point: the one person thinking about the machine, not the messages."}, "heading": "BLETCHLEY · September 1939"}, {"beat": "C1.4", "title": "THE CONTACT · the rotor, brush side, in WRNS hands", "ch": "THE CODEBREAKERS", "start": "0:08.800", "date": "1940", "status": "V", "img": "stills/_index_thumbs/C1_4.jpg", "fields": {"DATE": "1940 – the drum in hand is Bombe hardware, contemporary with the first Bombe of March 1940.", "WHAT": "A Bombe drum, brush side up. Each drum imitates one Enigma rotor; its rings of sprung wire brushes are the electrical fingers that let the Bombe hold a hypothesis about the enemy's rotor wiring and test it with current instead of with a human's afternoon.", "WHERE": "Bletchley Park's Bombe bays. Drums were fitted and swapped by WRNS operators – the hands here are a Wren's.", "WHAT WAS NEW": "Human logic cast into brass and wire. The deduction \"if this rotor stood here, that letter could not be that lamp\" becomes a circuit that either carries current or does not. This is the film's first picture of an idea becoming hardware.", "STAKES": "The daily key died every midnight. Whatever found it had to find it again tomorrow, and by hand that search took longer than the day the answer was good for.", "THREAD": "One drum tests one rotor guess. Mount ten dozen of them on a wall and let them spin through every position at once, and the search itself becomes a machine. → C1.3", "ON SCREEN": "AI-generated recreation built from the real drum's appearance: the red-lacquered shell, letters around the rim, concentric brush rings, held in a Wren's hands against the Bombe's black frame. Caveat for captioning: the real drum's brushes ran in four circles of 26; the recreation shows more rings than that."}, "heading": "THE CONTACT · 1940"}, {"beat": "C1.3", "title": "THE BOMBE [J5] · Hut 11, real colour, no glow", "ch": "THE CODEBREAKERS", "start": "0:11.730", "date": "Mar 1940", "status": "V", "img": "stills/_index_thumbs/C1_3.jpg", "fields": {"DATE": "March 1940 – the first Bombe, named \"Victory\", starts work at Bletchley Park (the National Museum of Computing gives 14 March 1940).", "WHAT": "Turing's electromechanical search engine, sharpened decisively by Gordon Welchman's diagonal board. A wall of spinning drums, each bank imitating an Enigma, driven through every rotor position in sequence. It is not a computer and does not decode anything – it eliminates: fed a crib (a guessed plaintext phrase), it discards every rotor setting that leads to a logical contradiction and halts on the few that survive. Humans test the survivors.", "WHERE": "Victory ran in Hut 1; its improved successor \"Agnes\" opened Hut 11 in August 1940, which became the Bombe room. By war's end there were hundreds of Bombes, operated around the clock by WRNS crews.", "WHAT WAS NEW": "The genius is the inversion: it does not try to find the key, it mechanises disproof – parallel logical elimination at electric speed. A day's impossible search becomes an hour of spinning drums.", "STAKES": "Midnight reset the enemy's settings; the Bombe made re-finding them a daily industrial process rather than a daily miracle.", "THREAD": "When the drums stopped in the right place, that day's German traffic fell open – and one exhausted mathematician got to read it first. → C1.5", "ON SCREEN": "AI-generated recreation: Turing at the drum wall, hand on a drum, a crib menu on the desk. The drum colours are the real scheme. Caveat for captioning: the setting reads as the later Hut 11 Bombe room; Victory itself stood in Hut 1. In reality the machines were tended chiefly by Wrens, not by Turing."}, "heading": "THE BOMBE · March 1940"}, {"beat": "C1.5", "title": "THE BREAK · Turing, glowing tape", "ch": "THE MACHINES THAT BROKE IT", "start": "0:15.010", "date": "1941", "status": "V", "img": "stills/_index_thumbs/C1_5.jpg", "fields": {"DATE": "1941 – the year naval Enigma opens. On 9 May 1941 boarders from HMS Bulldog's group take an intact Enigma and its codebooks off U-110 (Operation Primrose); captured weather-code books supply daily cribs; from August 1941 Hut 8 is reading U-boat traffic essentially continuously.", "WHAT": "The first sustained reading of the U-boat cipher – the intelligence stream code-named Ultra. Decrypts flow to the Admiralty's Operational Intelligence Centre, and convoys are steered around the wolfpacks.", "WHERE": "Hut 8, Bletchley Park → the Admiralty, London → the North Atlantic.", "WHAT WAS NEW": "Proof, in hand, that a machine can out-think a machine. The punched tape is the film's founding image of it: the answer is no longer written by a person – it comes out of machinery, and the person holds it up to the light.", "STAKES": "Rerouted convoys saved hundreds of thousands of tons of shipping and uncounted lives. And the deeper deposit the whole film draws on: the machine mind is born as a saviour. Whatever the ending asks, it asks against this.", "THREAD": "Germany's answer to leaks it could not locate was a bigger machine – the Lorenz teleprinter cipher carrying the High Command's own traffic, far beyond the Bombe's reach. Breaking that would take electronics. → C2.0", "ON SCREEN": "AI-generated recreation. Turing, exhausted-triumphant, holding a punched tape that glows amber – the only warm light in a black-and-white frame. Behind him the Atlantic plot and a wall of Bombe drums. The glow is the film's metaphor, not period reality: the medium itself becoming light."}, "heading": "THE BREAK · 1941"}, {"beat": "C2.0", "title": "COLOSSUS VALVE + PUNCH TAPE · the pair, one frame", "ch": "THE MACHINES THAT BROKE IT", "start": "0:17.930", "date": "Dec 1943", "status": "V", "img": "stills/_index_thumbs/C2_0.jpg", "fields": {"DATE": "December 1943 – the Colossus prototype runs at the Post Office Research Station, Dollis Hill, built by GPO telephone engineer Tommy Flowers.", "WHAT": "The two technologies that made Colossus, in one frame. The red valve is a Mullard EF36 pentode (introduced 1940) – the very type Colossus used by the hundred for its logic, an extra grid giving it a Boolean AND. The paper ribbon is 5-bit punched teleprinter tape – the intercepted Lorenz message, which Colossus read optically at 5,000 characters per second.", "WHERE": "Dollis Hill, London, then Bletchley Park.", "WHAT WAS NEW": "Flowers' heretical bet: that ~1,500 valves could run reliably – if you simply never switched them off. Everyone knew valves failed; Flowers knew from telephone exchanges that they failed at switch-on. Logic with no moving parts, a thousand times faster than relays: electronics at scale, born here.", "STAKES": "The Lorenz machine (Bletchley's \"Tunny\") had twelve wheels to Enigma's three and carried the German High Command's traffic – Hitler's own orders. The Bombe could not touch it.", "THREAD": "Put the valve and the tape together, two thousand times over, and you get a machine with a name to match its size. → C2.1", "ON SCREEN": "Photograph-real recreation. The valve's label is legible and correct: \"Mullard EF36 · BVA · BRITISH MADE\". The tape's punch pattern is the 5-hole teleprinter format. The pairing in one frame is the slide's argument: because of this and this, the next thing."}, "heading": "THE VALVE AND THE TAPE · December 1943"}, {"beat": "C2.1", "title": "COLOSSUS [J5] · Wren at the teleprinter", "ch": "THE MACHINES THAT BROKE IT", "start": "0:21.590", "date": "Feb 1944", "status": "V", "img": "stills/_index_thumbs/C2_1.jpg", "fields": {"DATE": "5 February 1944 – \"Colossus did its first job\" (Tommy Flowers' diary), the Mark 1 working at Bletchley Park after delivery from Dollis Hill. The 2,400- valve Mark 2 followed on 1 June 1944 – days before D-Day.", "WHAT": "The world's first large-scale electronic digital computer – programmable by switches and plugboard, not yet stored-program. It did not decrypt messages; it found the Lorenz wheel settings by statistical counting, at electronic speed, so humans could do the rest. Ten Colossi were running by war's end.", "WHERE": "Bletchley Park, in the Newmanry (Max Newman's section) – operated day and night by Wrens.", "WHAT WAS NEW": "Computing leaves the electromechanical age. Where the Bombe spun, Colossus counted – no moving parts in the logic at all. The line from here to every later machine in the film runs through this room. And nobody knew: Colossus stayed secret into the 1970s, so for thirty years the public story of the first computer belonged to a machine across the ocean.", "STAKES": "Reading the High Command's own traffic. Tunny decrypts are credited with confirming, before D-Day, that the deception plan was working – that the blow was expected at Calais, not Normandy.", "THREAD": "The war ends, the secret holds, and the room-sized electronic idea goes public under another name: a wall of glowing tubes in Philadelphia. → C2.2, the ENIAC tube.", "ON SCREEN": "A recreation of the most famous Colossus photograph – the two WRNS operators, commonly identified as Dorothy Du Boisson (at the switch panel) and Elsie Booker (at the tape bedstead), though the identifications have been debated. These are the women who actually worked the machine, animated using AI. The teleprinter, the racks of valves and the threaded tape loop follow the original. The photograph is usually captioned 1943, though it shows a Mark 2 – the caption date is contested; the machine's own dates above are firm."}, "heading": "COLOSSUS · February 1944"}, {"beat": "C2.2", "title": "THE ENIAC TUBE · 102 mm, in a hand", "ch": "THE MACHINES THAT BROKE IT", "start": "0:25.270", "date": "1945", "status": "M", "img": "stills/_index_thumbs/C2_2.jpg", "fields": {"DATE": "1945 – ENIAC is complete and computing by the autumn, still secret.", "WHAT": "A thermionic valve – the electronic switch. Nothing inside it moves: current through a heated filament is steered by a charged grid, so it can flip thousands of times a second, where a relay clacks tens.", "WHERE": "The Moore School of Electrical Engineering, University of Pennsylvania, Philadelphia – ENIAC ran about 17,500 of these at once.", "WHAT WAS NEW": "The switch loses its moving parts. Colossus proved valves could compute; ENIAC bet a whole general-purpose machine on them – and the engineering problem became keeping thousands of hot glass bulbs alive at once.", "STAKES": "Built for the Army's ballistics tables; a trajectory that took a human computer twenty hours took ENIAC thirty seconds.", "THREAD": "One tube in a hand. Now multiply by seventeen thousand and step back until the machine fills the room. → C2.3", "ON SCREEN": "AI-generated recreation: a single valve held between thumb and forefinger, a rack of thousands glowing soft orange behind. The hand holds the whole of compute – the film's scale-spine gesture, and the last era where that was true at this size."}, "heading": "THE ENIAC TUBE · 1945"}, {"beat": "C2.3", "title": "THE ENIAC [J5] · the two programmers", "ch": "ELECTRONS REPLACE MOTION", "start": "0:29.620", "date": "14 Feb 1946", "status": "V", "img": "stills/_index_thumbs/C2_3.jpg", "fields": {"DATE": "14 February 1946 – the Army and the University of Pennsylvania unveil ENIAC to the press; the \"Giant Brain\" makes front pages.", "WHAT": "The Electronic Numerical Integrator and Computer: forty panels in a U around a room, thirty tons, the first general-purpose electronic computer. Programmed not by typing but by rewiring – plugboards and switches, a job that could take days.", "WHERE": "The Moore School, Philadelphia.", "WHAT WAS NEW": "Computation at room scale, and in public. Colossus stayed secret into the 1970s, so this is the machine the world met first – the public birth of the computer.", "STAKES": "Its first big job was secret and enormous: calculations for the hydrogen bomb programme. The machine's reach exceeded its own room immediately.", "THREAD": "ENIAC's six original programmers were women, hired as human \"computers\" and handed a machine no manual existed for. Two of them are in the frame – and the next chapter belongs to the women who taught machines language. → C3.2", "ON SCREEN": "A colourised recreation of the famous Army publicity photograph: two of ENIAC's women programmers at the panels, re-plugging cables. They stand for the six – Kay McNulty, Betty Jennings, Betty Snyder, Marlyn Wescoff, Fran Bilas and Ruth Lichterman – whose programming work went largely uncredited for decades."}, "heading": "THE ENIAC · 14 February 1946"}, {"beat": "C3.2", "title": "TUBE vs UNIVAC PUNCH CARD · THE PIVOT", "ch": "ELECTRONS REPLACE MOTION", "start": "0:33.310", "date": "1951", "status": "M", "img": "stills/_index_thumbs/C3_2.jpg", "fields": {"DATE": "1951 – the year computing goes commercial, and the film's pivot frame.", "WHAT": "The two halves of the new industry in one frame: the valve that computes, and the punched card that carries the data in and out. A hole is a bit – information given a standard physical body any machine can read.", "WHERE": "The UNIVAC era – American business and government machines.", "WHAT WAS NEW": "Data becomes portable and universal. A card outlives the machine that punched it, so information starts accumulating across machines and decades instead of dying with its hardware.", "STAKES": "This is the precondition for everything that follows – archives, databases, corpora, and eventually the training sets that teach machines.", "THREAD": "The machine that made cards commercial arrived at the Census Bureau in the spring of 1951 – with a mathematician at its console who believed you should talk to a computer in English. → C3.1", "ON SCREEN": "AI-generated recreation: a hand holds a small valve beside a punched card, both at true size. The scale-spine's grammar again – compute and data as two objects you could drop."}, "heading": "TUBE vs PUNCH CARD · 1951"}, {"beat": "C3.1", "title": "HOPPER AT THE UNIVAC [J5]", "ch": "ELECTRONS REPLACE MOTION", "start": "0:36.950", "date": "31 Mar 1951", "status": "V", "img": "stills/_index_thumbs/C3_1.jpg", "fields": {"DATE": "31 March 1951 – the Census Bureau accepts delivery of UNIVAC I, the first commercial electronic computer in America.", "WHAT": "Grace Hopper at the UNIVAC console. A Navy mathematician who joined the Eckert–Mauchly company, she built the first compiler (A-0, 1952) and drove the idea that became COBOL: programs written in words.", "WHERE": "Eckert–Mauchly / Remington Rand, Philadelphia; the machine served the Census Bureau.", "WHAT WAS NEW": "Instruction becomes LANGUAGE. Until now you told a machine what to do by rewiring it; from here you tell it in symbols, and eventually in something close to English. Hopper's heresy – \"programs should be written in a language people read\" – is the straight line to every chat window.", "STAKES": "UNIVAC made computing a product. On election night 1952 it predicted Eisenhower's landslide from early returns while the pollsters disagreed – broadcast doubt, then machine vindication, in front of the country. (Commonly told this way; the broadcast details vary by account.)", "THREAD": "A machine that eats words and cards needs somewhere to keep them. The archive itself was about to become machine-readable. → C3.3", "ON SCREEN": "AI-generated recreation of Hopper at the UNIVAC's console, typing while the console lights answer – deliberately the same press → answer grammar as the Enigma shot, one rung up and on our side."}, "heading": "HOPPER AT THE UNIVAC · 31 March 1951"}, {"beat": "C3.3", "title": "MICROFILM + FLYING SPOT SCANNER + MAGNETIC TAPE", "ch": "ELECTRONS REPLACE MOTION", "start": "0:41.370", "date": "1953", "status": "M", "img": "stills/_index_thumbs/C3_3.jpg", "fields": {"DATE": "1953 – the era when storage fused with automation (UNIVAC's UNISERVO metal tape had arrived in 1951; FOSDIC development began in 1953).", "WHAT": "Three storage technologies in one frame: microfilm holding images of documents, the flying-spot scanner that reads film with a moving point of light, and magnetic tape – the reel that is simultaneously transport and archive.", "WHERE": "American government and corporate data processing – the Census Bureau above all.", "WHAT WAS NEW": "Memory that accumulates. A reel of tape holds what a room of clerks once filed, and a machine can read it back without a human touching paper.", "STAKES": "Once records are machine-readable, every institution's memory starts migrating into the machines – the Shelf begins to fill, and it will not empty until the cloud takes it half a century later.", "THREAD": "Film that machines can read invites the next question: can a machine LOOK at the film itself? The Census Bureau built exactly that. → C3.4", "ON SCREEN": "AI-generated still life: microfilm reel, scanner, and magnetic tape together on a work table – the storage lineage's family portrait."}, "heading": "MICROFILM, SCANNER, TAPE · 1953"}, {"beat": "C3.4", "title": "FOSDIC [J5] · reversed and colourised", "ch": "READING THE WORLD IN", "start": "0:44.250", "date": "1953", "status": "V", "img": "stills/_index_thumbs/C3_4.jpg", "fields": {"DATE": "1953 – development begins on FOSDIC (the first generation was working by 1954); it processed the 1960 census.", "WHAT": "FOSDIC – the Film Optical Sensing Device for Input to Computers, built by the Census Bureau with the National Bureau of Standards. Census questionnaires were microfilmed; FOSDIC read the position of pencil-filled marks off the film with a flying spot of light and wrote the answers to magnetic tape.", "WHERE": "The U.S. Census Bureau, Washington.", "WHAT WAS NEW": "The machine stops waiting for holes and starts LOOKING. This is the film's first act of machine perception – a machine given eyes and pointed at the world's paperwork.", "STAKES": "A national census, readable by machine within months instead of years of hand-tallying.", "THREAD": "Everything from ImageNet to the Street View car to a robot's face shield descends from this: perception, then understanding. But first the switch itself had to shrink. → C4.1", "ON SCREEN": "A colourised recreation in period style: the FOSDIC console with its operator loading a film reel, the machine's name spelled out on the header sign above the racks."}, "heading": "FOSDIC · 1953"}, {"beat": "C4.1", "title": "THE TRANSISTOR · valve + fingertip", "ch": "READING THE WORLD IN", "start": "0:48.650", "date": "23 Dec 1947", "status": "V", "img": "stills/_index_thumbs/C4_1.jpg", "fields": {"DATE": "23 December 1947 – Bardeen and Brattain demonstrate the point-contact transistor to Bell Labs management (it had first worked on the 16th; the public announcement came 30 June 1948).", "WHAT": "The transistor: the valve's job – switching and amplifying – done by a sliver of solid germanium. No vacuum, no glass, no heated filament, no warm-up, almost no power.", "WHERE": "Bell Telephone Laboratories, Murray Hill, New Jersey. Shockley, Bardeen and Brattain shared the 1956 Nobel Prize for it.", "WHAT WAS NEW": "Same job, a fraction of the size, and – decisive for everything after – it could keep shrinking. The valve had a floor; the transistor did not.", "STAKES": "The hinge of the whole film. Every later beat – the minicomputer, the personal computer, the phone, the orbital datacentre – is this size ratio applied again and again.", "THREAD": "The chronology here runs backwards on purpose: the film shows the 1969 moon landing next, then returns – because the transistor's children had to prove themselves before they flew people. → C4.0N", "ON SCREEN": "AI-generated macro: a valve lying on its side, and beside it a transistor on a fingertip. The size comparison IS the shot."}, "heading": "THE TRANSISTOR · 23 December 1947"}, {"beat": "C4.0N", "title": "NASA APOLLO MISSION CONTROL", "ch": "READING THE WORLD IN", "start": "0:51.590", "date": "20 Jul 1969", "status": "V", "img": "stills/_index_thumbs/C4_0N.jpg", "fields": {"DATE": "20 July 1969 – Apollo 11 lands on the Moon, run from the Mission Operations Control Room in Houston (opened 1965).", "WHAT": "Rows of consoles, the trajectory plot on the big board, engineers at screens – computing as the nervous system of a national undertaking. On board the spacecraft, the Apollo Guidance Computer flew the vehicle with about as much memory as a few pages of text.", "WHERE": "NASA's Manned Spacecraft Center (now Johnson Space Center), Houston.", "WHAT WAS NEW": "The machine becomes load-bearing for civilisation. This room is the proof that computers had graduated from calculating tables to holding lives in real time.", "STAKES": "Failure measured in lives, on live television, in front of six hundred million people.", "THREAD": "What made a computer light enough to fly – and reliable enough to trust – was the module in the next frame's palm. → C4.0S", "ON SCREEN": "AI-generated recreation of the Houston control room during Apollo: the arc of the trajectory on the big board, white shirts, smoke, rows of consoles. Deliberately the equilibrium frame – humans and machines at parity, the film's presence-gradient fulcrum."}, "heading": "MISSION CONTROL · 20 July 1969"}, {"beat": "C4.0S", "title": "CORE MEMORY + SLT MODULE · both in one palm", "ch": "READING THE WORLD IN", "start": "0:55.250", "date": "7 Apr 1964", "status": "V", "img": "stills/_index_thumbs/C4_0S.jpg", "fields": {"DATE": "7 April 1964 – the technology generation announced with the IBM System/360.", "WHAT": "In one palm: a core-memory plane – about a thousand hand-threaded ferrite rings, one bit per ring, 128 bytes on a plate the size of a coaster – and an IBM SLT module, the half-inch ceramic square holding the logic.", "WHERE": "IBM. Production tells the story: hundreds of thousands of SLT modules in 1963, six million in 1964, around sixty million in 1965.", "WHAT WAS NEW": "The thing that remembers and the thing that computes both fit in a hand – and both are now manufactured like rivets, not crafted like instruments.", "STAKES": "This manufacturing scale is what made a compatible family of computers possible at all.", "THREAD": "Sixty million modules a year have to go somewhere. They went into walls of blue cabinets. → C4.2", "ON SCREEN": "AI-generated macro built from IBM's own 1964 publicity photography: the woven core plane and the tiny SLT square in an open palm – the scale spine one rung down from the valve-and-tape pair."}, "heading": "CORE MEMORY + SLT MODULE · 7 April 1964"}, {"beat": "C4.2", "title": "SYSTEM/360 ROOM", "ch": "THE INDUSTRIAL BRAIN", "start": "0:58.900", "date": "7 Apr 1964", "status": "V", "img": "stills/_index_thumbs/C4_2.jpg", "fields": {"DATE": "7 April 1964 – IBM announces the System/360, a single compatible family from small to large, on a development bet of about five billion 1964 dollars – twice IBM's annual revenue, the biggest privately funded industrial project there had been.", "WHAT": "The corporate machine room: raised floor, walls of tape drives, blue panels, white-coated operators.", "WHERE": "Every large company and agency in the industrialised world within a decade.", "WHAT WAS NEW": "Computing becomes infrastructure – bought, depreciated and depended upon. Software written for the small model ran on the big one, so a company's programs outlived its hardware. Code became capital.", "STAKES": "From here the machine's growth is funded by everyone's balance sheet, which is why it never stops.", "THREAD": "The room belonged to institutions. The next machine fit beside one person. → C4.4", "ON SCREEN": "AI-generated recreation of a System/360 installation at full dress – deliberately the most materially crowded frame in the film, because a later beat empties it."}, "heading": "SYSTEM/360 · 7 April 1964"}, {"beat": "C4.4", "title": "PDP-8/I + TELETYPE [J5]", "ch": "THE INDUSTRIAL BRAIN", "start": "1:02.570", "date": "Dec 1968", "status": "V", "img": "stills/_index_thumbs/C4_4.jpg", "fields": {"DATE": "December 1968 – the PDP-8/I ships (the original PDP-8, March 1965, was the first successful minicomputer, priced around $18,000 against the mainframe's millions).", "WHAT": "A Digital Equipment Corporation PDP-8/I with its teletype – a computer the size of a fridge rather than a room, bought by laboratories, schools and small companies.", "WHERE": "DEC, Maynard, Massachusetts – and thousands of ordinary rooms that could never have justified a machine room.", "WHAT WAS NEW": "The computer arrives BESIDE ONE PERSON. No glass wall, no operators, no booking sheet: you sat at it.", "STAKES": "The first narrowing of the relationship from institution to individual – the move that ends with a machine in a pocket.", "THREAD": "Put a person at every machine and the next question writes itself: can the machines reach each other? → C7.2", "ON SCREEN": "AI-generated recreation: one person at the teletype beside the PDP-8/I's open logic cabinet, its cards visible – the machine and its human at equal scale, in the J5 relation."}, "heading": "PDP-8/I · December 1968"}, {"beat": "C7.2", "title": "UCLA \"LO\" [J5] · Kline", "ch": "THE INDUSTRIAL BRAIN", "start": "1:06.224", "date": "29 Oct 1969", "status": "V", "img": "stills/_index_thumbs/C7_2.jpg", "fields": {"DATE": "29 October 1969, 10:30 pm – the first ARPANET message, sent from UCLA to the Stanford Research Institute.", "WHAT": "Student programmer Charley Kline, supervised by Leonard Kleinrock, typing LOGIN to Bill Duvall's machine at SRI, 350 miles away. The link crashed after two letters. The first message ever carried by the network that became the internet was \"LO\".", "WHERE": "Boelter Hall, UCLA – the first node; SRI was the second.", "WHAT WAS NEW": "One machine reaching another machine in another place, through the Interface Message Processor – the first router.", "STAKES": "Until now the film has followed one machine getting better. From here it also follows machines finding each other – the second path, and the one that ends with all of them connected.", "THREAD": "A handful of nodes needs a map. → C7.4", "ON SCREEN": "AI-generated recreation of the UCLA machine room: the IMP cabinet, the teleprinter with the two letters on paper, the men reading it. The letters were drawn locally and composited – generated text kept dropping the L's stem."}, "heading": "\"LO\" · 29 October 1969"}, {"beat": "C7.4", "title": "THE ARPANET MAP", "ch": "THE INDUSTRIAL BRAIN", "start": "1:09.890", "date": "1969", "status": "V", "img": "stills/_index_thumbs/C7_4.jpg", "fields": {"DATE": "1969 – four nodes by year's end: UCLA, SRI, UC Santa Barbara, Utah.", "WHAT": "The ARPANET logical map – circles for sites, lines for links, the whole network drawn on one sheet.", "WHERE": "ARPA's network, spanning American universities and contractors.", "WHAT WAS NEW": "The connections become a FABRIC someone can inspect and extend. A network with a map is an object of design: you can look at the whole and decide to add to it.", "STAKES": "Growth becomes deliberate. Every era after this has a version of this map, and every version is denser.", "THREAD": "The map addressed machines at places. The next beat addresses a person at a machine – and the network acquires people. → C7.3", "ON SCREEN": "A recreation of the hand-drawn ARPA logical map being pinned up. Caveat for captioning: the sheet in frame is styled on the May 1973 logical map (UCLA, SRI, BBN, Harvard, RAND and the rest legible on it), shown at the timeline's 1969 position where the network it grew from began."}, "heading": "THE ARPANET MAP · 1969"}, {"beat": "C7.3", "title": "TOMLINSON AND THE @ [J5]", "ch": "THE SECOND PATH", "start": "1:13.550", "date": "1971", "status": "V", "img": "stills/_index_thumbs/C7_3.jpg", "fields": {"DATE": "1971 – Ray Tomlinson, an engineer at Bolt Beranek and Newman, sends the first network email between two machines.", "WHAT": "The address form he invented in the same act: user@host. He picked the @ because it appeared in no one's name and read naturally as \"at\".", "WHERE": "BBN, Cambridge, Massachusetts – the company that built the ARPANET's IMPs.", "WHAT WAS NEW": "The network begins addressing A PERSON AT A MACHINE rather than a machine at a place. Once messages are addressed to humans, the system carries human relationships.", "STAKES": "Email became the network's first indispensable use – the thing that made ordinary institutions want in. Social scale starts here.", "THREAD": "The film pauses its history for one breath to show its own structure: from here, two stories run in parallel. → C7.1", "ON SCREEN": "AI-generated recreation: Tomlinson at his teletype, the paper reading tomlinson@bbn – the whole invention in eleven characters."}, "heading": "TOMLINSON'S @ · 1971"}, {"beat": "C7.1", "title": "THE DISSOLVE · second path opens", "ch": "THE SECOND PATH", "start": "1:17.200", "date": "", "status": "", "img": "stills/_index_thumbs/C7_1.jpg", "fields": {"DATE": "None – this is the film talking about itself.", "WHAT": "A machine wall dissolving into a web of light: circuits becoming connections.", "WHERE": "Nowhere – the film's first purely abstract frame.", "WHAT WAS NEW": "The claim, made visually: computing detaches from any particular machine. What matters from here is the pattern, not the box it runs in.", "STAKES": "This is what makes everything after possible – software, the web, the cloud, and finally intelligence that treats hardware as clothing.", "THREAD": "Back to the boards – because before the pattern could float free, someone had to ask why a processor was many chips instead of one. → C5.1", "ON SCREEN": "AI-generated: threads of light weaving themselves outward from a machine's edge into a circuit-constellation – built to read as construction, not decay."}, "heading": "THE DISSOLVE · the second path opens"}, {"beat": "C5.1", "title": "THE PDP-11 BOARD", "ch": "THE SECOND PATH", "start": "1:20.850", "date": "Jan 1970", "status": "V", "img": "stills/_index_thumbs/C5_1.jpg", "fields": {"DATE": "January 1970 – the PDP-11 arrives, the minicomputer that defined its decade.", "WHAT": "Its CPU boards: printed circuit boards carrying rows of 7400-series TTL chips. A processor, laid flat, countable.", "WHERE": "DEC – and, through Unix and C which grew up on PDP-11s, the ancestry of most software alive today.", "WHAT WAS NEW": "A CPU is visibly THIS MANY CHIPS – and the chapter's question stares out of the frame: why can't they be one?", "STAKES": "Whoever answered that question would put a processor in everything. (Intel's 4004 answered it the following year.)", "THREAD": "While the hardware shrank toward one chip, the people instructing it moved from card decks to glowing terminals. → C5.3", "ON SCREEN": "AI-generated macro of PDP-11 processor boards laid side by side, every chip legible as a discrete thing."}, "heading": "THE PDP-11 BOARD · January 1970"}, {"beat": "C5.3", "title": "THE CODING FLOOR · IBM 3277s", "ch": "THE SECOND PATH", "start": "1:24.530", "date": "6 May 1971", "status": "V", "img": "stills/_index_thumbs/C5_3.jpg", "fields": {"DATE": "6 May 1971 – IBM announces the 3270 terminal family; the 3277 became the workhorse screen of the mainframe decade.", "WHAT": "A floor of programmers at IBM 3277 terminals, green text on dark glass, faces averted, typing.", "WHERE": "Corporate data processing floors everywhere.", "WHAT WAS NEW": "The terminal replaces the card deck. The human relationship to the machine becomes immediate: type, and the machine answers now, not tomorrow morning.", "STAKES": "This is peak human instruction-giving – the most machine-authority human hands ever hold in this film. The rest of the story is the descent from this high-water mark.", "THREAD": "All of it still belonged to institutions. Then two young men in a garage built a board. → C6.1B", "ON SCREEN": "AI-generated recreation of a 1971 terminal floor – white shirts, green screens, furious volume. A late-film beat rhymes with this composition inverted: the same posture when the machine is the one working."}, "heading": "THE CODING FLOOR · 6 May 1971"}, {"beat": "C6.1B", "title": "THE APPLE II MOTHERBOARD · the board itself", "ch": "THE PERSONAL REVOLUTION", "start": "1:28.200", "date": "Apr 1977", "status": "V", "img": "stills/_index_thumbs/C6_1B.jpg", "fields": {"DATE": "April 1977 – the Apple II is unveiled at the West Coast Computer Faire (first units shipped that June).", "WHAT": "The board Steve Wozniak actually designed, alone: a MOS 6502 processor, integrated colour video, and a row of eight expansion slots, on one green board.", "WHERE": "Cupertino, California – a company then months old.", "WHAT WAS NEW": "A complete computer as ONE ELEGANT BOARD a person could design, understand and own. The artefact before the machine it became.", "STAKES": "The board is the argument that computing could be personal property rather than institutional plant.", "THREAD": "Meet the board, then meet its maker. → C6.2", "ON SCREEN": "AI-generated macro of the bare Apple II motherboard on a dark surface – the film introduces the artefact before the person, the same move as the rotor before the Bombe."}, "heading": "THE APPLE II BOARD · April 1977"}, {"beat": "C6.2", "title": "WOZNIAK + APPLE II [J5]", "ch": "THE PERSONAL REVOLUTION", "start": "1:30.730", "date": "Apr 1977", "status": "V", "img": "stills/_index_thumbs/C6_2.jpg", "fields": {"DATE": "April 1977 – the Apple II goes public: the first mass-market personal computer that worked out of the box.", "WHAT": "Wozniak at the machine: keyboard, screen and floppy drives on one desk, for one person.", "WHERE": "The garage-to-Cupertino world of early Apple.", "WHAT WAS NEW": "THE CONVERGENCE. The microprocessor, the keyboard-and-screen, and removable storage – three lineages the film has followed separately since wartime – meet on a single desk.", "STAKES": "Computing becomes personal property. Everything after this assumes a computer is something a person, not an institution, has.", "THREAD": "Then the biggest institution of all decided personal computing was furniture, and hired a tramp to say so. → C6.4", "ON SCREEN": "AI-generated portrait of Wozniak with the Apple II in the J5 relation – shelves of 5.25-inch floppies behind, oscilloscope on the bench: the builder still visibly a builder."}, "heading": "WOZNIAK + APPLE II · April 1977"}, {"beat": "C6.4", "title": "CHAPLIN + IBM PC AT [J5]", "ch": "THE PERSONAL REVOLUTION", "start": "1:33.300", "date": "Aug 1984", "status": "V", "img": "stills/_index_thumbs/C6_4.jpg", "fields": {"DATE": "August 1984 – the IBM PC AT ships (the machine in frame). The Little Tramp campaign it belongs to began in 1981 with the original IBM PC and ran to 1988.", "WHAT": "Charlie Chaplin's Tramp – licensed by IBM as its advertising face – at a white table with an IBM PC and a single red rose.", "WHERE": "IBM's campaign, on every American television and magazine page.", "WHAT WAS NEW": "The personal computer as a STANDARD BUSINESS OBJECT – modular, expandable, boring the way infrastructure is boring. IBM's imprimatur told every office the strange new machine was safe.", "STAKES": "Nobody argues about a filing cabinet. The machine's spread stops being a movement and becomes procurement.", "THREAD": "And then, the same year, the machine said hello. → C6.5", "ON SCREEN": "AI-generated recreation of the campaign's grammar – tramp, white table, PC, red rose, deadpan to the lens. The AT model on the desk is the 1984 machine; the campaign itself began three years earlier with the original PC."}, "heading": "CHAPLIN + THE IBM PC · August 1984"}, {"beat": "C6.5", "title": "JOBS + MACINTOSH [J5]", "ch": "THE PERSONAL REVOLUTION", "start": "1:35.490", "date": "24 Jan 1984", "status": "V", "img": "stills/_index_thumbs/C6_5.jpg", "fields": {"DATE": "24 January 1984 – Steve Jobs pulls the Macintosh out of its bag.", "WHAT": "The first mass-market computer built around a graphical interface and a mouse – windows, icons, and a screen that says \"hello.\"", "WHERE": "Apple, Cupertino; the launch at the Flint Center, announced two days earlier by the \"1984\" Super Bowl ad.", "WHAT WAS NEW": "Instruction stops being symbolic and becomes SPATIAL – point at the thing, move the thing. Files become objects; the machine becomes a place.", "STAKES": "Rung three of the instruction ladder: wiring, then language, then pointing. One rung remains – conversation – and it is thirty-eight years away.", "THREAD": "The last human portrait of the act. What follows is not the individual but the network. → C7.6", "ON SCREEN": "AI-generated portrait of Jobs with the Macintosh showing \"hello.\" in the J5 relation – young, formal, the machine small and friendly on the desk."}, "heading": "MACINTOSH · 24 January 1984"}, {"beat": "C7.6", "title": "GATES + NETWORKED PC [J5]", "ch": "THE PERSONAL REVOLUTION", "start": "1:39.900", "date": "", "status": "", "img": "stills/_index_thumbs/C7_6.jpg", "fields": {"DATE": "The early 1990s – the Windows-era PC on every desk, modem and network assumed.", "WHAT": "Bill Gates with a beige tower and CRT, the Microsoft mark on screen.", "WHERE": "Microsoft, Redmond – and several hundred million desks.", "WHAT WAS NEW": "The standardised personal machine joins the network as a matter of course. Software – not hardware – becomes the product, and one company's decisions reach every desk on earth at once.", "STAKES": "The two conditions for everything web-shaped: a common machine, and a wire into it.", "THREAD": "The wire was about to become a place. → C7.5", "ON SCREEN": "AI-generated portrait of young Gates in the J5 relation. This beat has no single date in the film's chronology map by design – it stands for an era, not an event."}, "heading": "THE NETWORKED PC · the early 1990s"}, {"beat": "C7.5", "title": "BERNERS-LEE + NeXT [J5]", "ch": "THE WEB", "start": "1:42.800", "date": "1990", "status": "V", "img": "stills/_index_thumbs/C7_5.jpg", "fields": {"DATE": "1990 – by Christmas, Tim Berners-Lee at CERN has defined HTML, HTTP and the URL, and written the first browser and the first server, all on one black NeXT cube.", "WHAT": "The machine that was the entire World Wide Web for a while – info.cern.ch – with its hand-written warning label.", "WHERE": "CERN, Geneva. He gave the web away: no patent, no royalties.", "WHAT WAS NEW": "The network becomes a navigable PLACE made of linked documents. Before this the net moved messages; now it holds a geography anyone can walk.", "STAKES": "Everything social, commercial and eventually conversational rides on this – given to the world free, which is why it won.", "THREAD": "A place that big needs a door. Eight years later the door was an empty text box. → C7.7B", "ON SCREEN": "AI-generated recreation of Berners-Lee at the NeXT cube, the WorldWideWeb page on screen and the real label recreated: \"This machine is a server. DO NOT POWER IT DOWN!!\""}, "heading": "BERNERS-LEE + NeXT · 1990"}, {"beat": "C7.7B", "title": "THE SEARCH BOX · 1998", "ch": "THE WEB", "start": "1:47.210", "date": "1998", "status": "V", "img": "stills/_index_thumbs/C7_7B.jpg", "fields": {"DATE": "1998 – Google is founded on 4 September, in the papers of two Stanford graduate students.", "WHAT": "An empty search field on a plain white page.", "WHERE": "A garage in Menlo Park, then the world.", "WHAT WAS NEW": "The connected world becomes addressable through ONE EMPTY FIELD. Behind the box, PageRank read the web's own link structure as a vote about what mattered – the network ranking itself.", "STAKES": "Whoever owns the door to the web owns the web's economics. The box became the most valuable rectangle in commerce.", "THREAD": "The interface has collapsed to a single line of text awaiting typed words – the same shape as the chat window twenty-four years later. But first, everything physical had to leave the room. → C8.6A", "ON SCREEN": "AI-generated period scene: the Google page of 1998 on a CRT in a home study, hands at the keyboard."}, "heading": "THE SEARCH BOX · 1998"}, {"beat": "C8.6A", "title": "THE FULL SHELF", "ch": "THE WEB", "start": "1:50.120", "date": "", "status": "", "img": "stills/_index_thumbs/C8_6A.jpg", "fields": {"DATE": "None on the timeline – the shelf stands for the late-1990s peak of owned physical media.", "WHAT": "A home desk under shelves packed solid: software boxes, CD-ROMs, Zip disks, tapes, manuals – storage as POSSESSIONS.", "WHERE": "Everyone's den.", "WHAT WAS NEW": "Nothing – that is the point. This is the high-water mark of an old idea: that your data is a thing on your shelf.", "STAKES": "Custody. Every object in this frame is under its owner's roof and no one else's control.", "THREAD": "Hold the frame. The next slide is the same desk. → C8.6B", "ON SCREEN": "AI-generated: a 1990s study dressed to maximum density, a CRT running a period desktop beneath the loaded shelves."}, "heading": "THE FULL SHELF · the peak of physical media"}, {"beat": "C8.6B", "title": "THE EMPTY SHELF · the Shelf empties", "ch": "THE WEB", "start": "1:53.800", "date": "", "status": "", "img": "stills/_index_thumbs/C8_6B.jpg", "fields": {"DATE": "None – the same desk, one era later.", "WHAT": "The same shelves, empty. On the desk, a thin laptop showing a cloud icon, and a phone beside it.", "WHERE": "The same den; the contents now live in datacentres.", "WHAT WAS NEW": "Storage did not shrink – it MOVED OUT. Somebody else now holds it, somewhere you will never visit, under terms you clicked past.", "STAKES": "The first surrender of custody, made freely and gladly, one upload at a time. The film's later datacentre and orbital beats are this shelf's contents, relocated and multiplied.", "THREAD": "What emptied the shelf was the thing that fit in a pocket. → C8.1", "ON SCREEN": "AI-generated: the identical composition to the previous slide with the objects gone – a before/after pair built as one held cut."}, "heading": "THE EMPTY SHELF · custody surrendered"}, {"beat": "C8.1", "title": "THE iPHONE · Macworld 2007", "ch": "THE POCKET", "start": "1:57.400", "date": "9 Jan 2007", "status": "V", "img": "stills/_index_thumbs/C8_1.jpg", "fields": {"DATE": "9 January 2007 – Steve Jobs announces the iPhone at Macworld San Francisco.", "WHAT": "\"An iPod, a phone, and an internet communicator\" – one slab of glass, and the hand motif the film has run since the Bombe rotor lands on a thirty-foot stage screen.", "WHERE": "Moscone Center, San Francisco; on sale that June.", "WHAT WAS NEW": "Computing stops being somewhere you go and becomes something you carry. The machine gains sensors – camera, GPS, touch – and the network gains a billion always-on endpoints.", "STAKES": "Every later beat about data, attention and scale depends on this distribution. The corpus that trains the learning machines is about to be written on these.", "THREAD": "Put a camera and a feed in every pocket and something new appears: the crowd, lit from below. → C8.0S", "ON SCREEN": "AI-generated recreation of the Macworld keynote: Jobs small on the dark stage, the phone enormous in a projected hand behind him."}, "heading": "THE iPHONE · 9 January 2007"}, {"beat": "C8.0S", "title": "THE SOCIAL NETWORKS · YouTube · Facebook · Twitter · Pinterest · Instagram · LinkedIn", "ch": "THE POCKET", "start": "2:01.120", "date": "", "status": "", "img": "stills/_index_thumbs/C8_0S.jpg", "fields": {"DATE": "The arrival years: Facebook 2004, YouTube 2005, Twitter 2006, Instagram 2010 – the era, not one event.", "WHAT": "The feeds – the services that turned the web's readers into its writers.", "WHERE": "Silicon Valley, then every phone on earth.", "WHAT WAS NEW": "The network turns human attention into a product with a supply chain. Billions of people writing, photographing, labelling and linking – for free, forever.", "STAKES": "This is where the training corpus comes from. Everything the learning machines of the next chapter consume is produced here, by people, for each other.", "THREAD": "Look up from the feed for one frame, and see what it looks like from outside. → C8.3", "ON SCREEN": "The current plate is a dense collage of the era's marks (YouTube, Facebook, Twitter, Instagram and the rest). The intended final form – ruled in the story notes – is the feed assembling in sequence rather than a wall of logos; the beat is held pending settled brand marks."}, "heading": "THE SOCIAL NETWORKS · 2004–2010"}, {"beat": "C8.3", "title": "THE NIGHT CROWD · phones at night lighting up faces", "ch": "THE POCKET", "start": "2:04.020", "date": "", "status": "", "img": "stills/_index_thumbs/C8_3.jpg", "fields": {"DATE": "None – the 2010s as a condition, not an event.", "WHAT": "A city crossing at night, every face lit from below by its own phone.", "WHERE": "Anywhere. That is the point.", "WHAT WAS NEW": "The machine's presence becomes AMBIENT and collective rather than personal and deliberate. Nobody in the frame decided to use a computer tonight; the using is simply the condition they stand in.", "STAKES": "The presence-gradient tips here – the film's humans will never again be in a frame the machine is not.", "THREAD": "While the crowd looked down, cars with camera masts were photographing everywhere they weren't looking. → C8.5", "ON SCREEN": "AI-generated night street: a dense crossing, dozens of faces, each one underlit by a screen. Slated for a higher-resolution re-roll when credits allow (al1)."}, "heading": "THE NIGHT CROWD · the ambient decade"}, {"beat": "C8.5", "title": "THE STREET VIEW CAR", "ch": "THE POCKET", "start": "2:07.700", "date": "May 2007", "status": "V", "img": "stills/_index_thumbs/C8_5.jpg", "fields": {"DATE": "25 May 2007 – Google Street View launches in five American cities.", "WHAT": "An ordinary car wearing a camera mast, systematically photographing every street it drives.", "WHERE": "Beginning in San Francisco, ending everywhere lawful (and litigated where not).", "WHAT WAS NEW": "The physical world, systematically photographed, located and reconstructed. FOSDIC learned to look at a page; this looks at EVERYWHERE.", "STAKES": "Perception at planetary scale – the second great corpus. When machines later learn to see, this is much of what they practise on.", "THREAD": "Two corpora now exist: what humanity wrote about itself, and what the cameras saw. Someone had to teach the machines to read them. → C9.2", "ON SCREEN": "AI-generated: a camera-masted car on a quiet residential street. Caveat for captioning: the street furniture and number plate in the plate read as German – fitting for the technology's most contested territory, but not its launch geography."}, "heading": "THE STREET VIEW CAR · May 2007"}, {"beat": "C9.2", "title": "IMAGENET · Fei-Fei Li", "ch": "MACHINES THAT LEARN", "start": "2:10.597", "date": "2009", "status": "V", "img": "stills/_index_thumbs/C9_2.jpg", "fields": {"DATE": "2009 – Fei-Fei Li's ImageNet is presented at CVPR: twelve million images, tens of thousands of categories, each image named by a human.", "WHAT": "The labelled corpus – pictures paired with words, at a scale no one had attempted.", "WHERE": "Princeton, then Stanford; the labelling crowd-sourced worldwide.", "WHAT WAS NEW": "Humans teach the machine to see BY GIVING IMAGES NAMES. Li's bet was that data, not cleverer algorithms, was the missing ingredient – and the annual ImageNet contest became the proving ground that settled it.", "STAKES": "The bridge between perception and understanding. Chapter ten of the film begins here because everything after it is learned rather than programmed.", "THREAD": "For three years the contest's error rates crept down. Then a team from a Toronto office cut them nearly in half. → C9.3", "ON SCREEN": "AI-generated portrait: Li at a screen of labelled image grids, pointing – the names and the pictures visibly joined."}, "heading": "IMAGENET · 2009"}, {"beat": "C9.3", "title": "HINTON'S OFFICE", "ch": "MACHINES THAT LEARN", "start": "2:13.900", "date": "2012", "status": "V", "img": "stills/_index_thumbs/C9_3.jpg", "fields": {"DATE": "2012 – AlexNet, from Geoffrey Hinton's Toronto group, wins the ImageNet contest by an unprecedented margin, running its neural network on gaming GPUs.", "WHAT": "Hinton in an ordinary university office, network diagrams pinned to the wall – the decades-unfashionable idea he kept alive until the hardware and the data caught up.", "WHERE": "The University of Toronto (Alex Krizhevsky and Ilya Sutskever built AlexNet as his students).", "WHAT WAS NEW": "LEARNING beats programming, publicly and by a wide margin. Neural networks – written off for decades – become the field overnight.", "STAKES": "Every conversational machine in the film's last act descends from this result and this small research lineage.", "THREAD": "Two years later, a small institute spent its time on a harder question: what happens if this keeps working? → C9.P0", "ON SCREEN": "AI-generated: Hinton standing before a wall of pinned network-layer drawings – deliberately unspectacular, because the transformation was intellectual before it was industrial."}, "heading": "HINTON'S OFFICE · 2012"}, {"beat": "C9.P0", "title": "THE LIGHT CONE ARGUMENT · MIRI 2014", "ch": "MACHINES THAT LEARN", "start": "2:17.190", "date": "2014", "status": "V", "img": "stills/_index_thumbs/C9_P0.jpg", "fields": {"DATE": "2014 – Nick Bostrom's Superintelligence is published in July; MIRI and others make the argument in public while AI is still a lab curiosity.", "WHAT": "A research meeting at a whiteboard: the light-cone argument – that an intelligence unbound by human limits inherits the future's entire reach, so its initial aims matter more than anything else we build.", "WHERE": "The Machine Intelligence Research Institute, Berkeley, and the small community around it.", "WHAT WAS NEW": "The case made EARLY, calmly, by people who were not opposed to the technology – years before the systems that made it feel urgent.", "STAKES": "If the argument is right, the stakes are everything the future contains. The film places the warning before the mechanism so the sequence reads: the warning, then the thing it describes.", "THREAD": "The institutions that would test the question were already being funded. → C10.2", "ON SCREEN": "The MIRI table with the argument inked on the whiteboard and the MIRI wordmark above the board (both restored in v50–v51 – the cached index thumbnail predates the restoration). The board content was composited locally, not generated."}, "heading": "THE WARNING · 2014"}, {"beat": "C10.2", "title": "DEMIS / DEEPMIND", "ch": "MACHINES THAT LEARN", "start": "2:20.510", "date": "", "status": "", "img": "stills/_index_thumbs/C10_2.jpg", "fields": {"DATE": "January 2014 – Google buys DeepMind, a London AI startup with no product, for a reported half a billion dollars.", "WHAT": "Demis Hassabis – chess prodigy, game designer, neuroscientist – and the institution he co-founded in 2010 with a mission statement of two steps: solve intelligence; use it to solve everything else.", "WHERE": "London, inside Google.", "WHAT WAS NEW": "Learning acquires CAPITAL, staff and a building. Research becomes industry, and industry means competition, and competition sets the pace for everything that follows.", "STAKES": "The price signalled what the buyers believed: that learning machines were about to matter enormously.", "THREAD": "Two years later, DeepMind's machine sat down – by proxy – across a Go board from the strongest player of his generation. → C9.5", "ON SCREEN": "AI-generated portrait of Hassabis on the DeepMind office floor, the wordmark behind, Go positions on the screens."}, "heading": "DEEPMIND · 2014"}, {"beat": "C9.5", "title": "MOVE 37 · Seoul 2016", "ch": "MACHINES THAT ACT", "start": "2:23.760", "date": "10 Mar 2016", "status": "V", "img": "stills/_index_thumbs/C9_5.jpg", "fields": {"DATE": "10 March 2016 – game two of AlphaGo versus Lee Sedol, Seoul. AlphaGo won the match 4–1; two hundred million people watched.", "WHAT": "Move 37: AlphaGo's shoulder hit on the fifth line – a move its own model gave humans a one-in-ten-thousand chance of playing. Commentators assumed a mistake; it won the game. Aja Huang's hand placed the stone the machine chose.", "WHERE": "The Four Seasons hotel, Seoul.", "WHAT WAS NEW": "The machine CHOOSES an action no teacher supplied – outside the distribution of human play, and better. And it must borrow a human hand to enter the world.", "STAKES": "Centuries of accumulated intuition in the oldest game there is, revised by a machine in an afternoon.", "THREAD": "It is also the last time in this film the machine needs the borrowed hand – the robotics beats answer that. But first, the mechanism that would teach machines language arrived as fifteen pages of paper. → C10.1", "ON SCREEN": "AI-generated recreation of the Seoul match: the board between the two, the game clocks reading ALPHAGO and LEE SEDOL, the human hand placing the machine's stone."}, "heading": "MOVE 37 · 10 March 2016"}, {"beat": "C10.1", "title": "ATTENTION · the 2017 paper", "ch": "MACHINES THAT ACT", "start": "2:27.080", "date": "12 Jun 2017", "status": "V", "img": "stills/_index_thumbs/C10_1.jpg", "fields": {"DATE": "12 June 2017 – \"Attention Is All You Need\" is posted to arXiv by eight Google researchers.", "WHAT": "The Transformer: an architecture that reads everything at once and learns what to attend to. Fifteen pages, one diagram – the mechanism inside every large language model that followed.", "WHERE": "Google Brain and Google Research, Mountain View; built first for machine translation.", "WHAT WAS NEW": "Attention replaces sequence. The design scales almost without limit – feed it more data and more compute and it simply gets better, which turned model-building into an industrial race.", "STAKES": "The film shows it as PAPER because that is what it was: the entire conversational era, published as a document anyone could read.", "THREAD": "Scale the paper up for five years and it learns to talk. But its first children went to work in warehouses. → C12.4", "ON SCREEN": "AI-generated still life: the printed paper under a hand, the architecture diagram beside it, a GPU rack's lights in the margin, and translation pairs (German to English) on the monitor – the job the Transformer was born for."}, "heading": "ATTENTION · 12 June 2017"}, {"beat": "C12.4", "title": "THE FULFILMENT CENTRE · robots", "ch": "MACHINES THAT ACT", "start": "2:30.360", "date": "", "status": "", "img": "stills/_index_thumbs/C12_4.jpg", "fields": {"DATE": "The 2010s and after – warehouse robotics at scale (Amazon's purchase of Kiva Systems in 2012 marks the era's start).", "WHAT": "A fulfilment-centre floor worked by robots: shelves that move themselves, drive units gliding under pallets, no person in the aisle.", "WHERE": "The logistics networks behind every next-day parcel.", "WHAT WAS NEW": "Physical labour reorganised around MACHINE convenience rather than human reach – aisles too tight for people, bins arranged for algorithms, light optional.", "STAKES": "The least dramatic embodiment beat, which is the point: the machine took the warehouse and nobody made a film about it.", "THREAD": "From a floor with no people to a driver's seat with no driver. → C12.2", "ON SCREEN": "AI-generated: an automated floor mid-shift, a laden drive robot in the foreground, conveyors overhead, the aisle empty of humans."}, "heading": "THE FULFILMENT CENTRE · the robot floor"}, {"beat": "45B", "title": "UNASSIGNED · a window Mark opened, awaiting a beat", "ch": "MACHINES THAT ACT", "start": "2:33.670", "date": "", "status": "", "img": "stills/_index_thumbs/45B.jpg", "fields": null, "heading": null}, {"beat": "C12.2", "title": "THE WAYMO VIEW · driverless", "ch": "MACHINES THAT ACT", "start": "2:36.940", "date": "Oct 2020", "status": "V", "img": "stills/_index_thumbs/C12_2.jpg", "fields": {"DATE": "8 October 2020 – Waymo opens fully driverless rides to the general public in Phoenix: no safety driver, ordinary passengers.", "WHAT": "The road seen from inside a car whose driver's seat is empty, the wheel turning itself.", "WHERE": "Phoenix, Arizona first; other cities followed.", "WHAT WAS NEW": "Sensing, prediction and physical action united in one system – holding a human life in traffic, in real time, with nobody supervising.", "STAKES": "After this the question is no longer capability but AUTHORITY: what are we willing to let it be responsible for?", "THREAD": "One car deciding for itself is a marvel. A sky of machines deciding together is a different thing. → C12.5", "ON SCREEN": "AI-generated interior: the empty driver's seat, the route on the dash, a passenger in the back – the absence in the frame is the subject."}, "heading": "THE WAYMO VIEW · October 2020"}, {"beat": "C12.5", "title": "THE DRONES · flying in patterns", "ch": "THE CONVERSATION", "start": "2:40.270", "date": "", "status": "", "img": "stills/_index_thumbs/C12_5.jpg", "fields": {"DATE": "The 2020s – swarm flight as routine spectacle and routine logistics.", "WHAT": "Dozens of drones holding and changing formation against a dusk sky.", "WHERE": "Above cities, warehouses, borders and battlefields.", "WHAT WAS NEW": "Machines coordinating WITH EACH OTHER rather than each with a person. The unit of autonomy stops being one machine and becomes the group.", "STAKES": "Autonomy becomes plural. The film's orbital constellation is this same idea at planetary scale.", "THREAD": "And then the machines learned to hold up their end of a conversation. → C10.3", "ON SCREEN": "AI-generated: a grid of quadcopters in disciplined formation, small against a grey-violet sky – pattern as the subject, no single machine the hero."}, "heading": "THE DRONES · machines in formation"}, {"beat": "C10.3", "title": "ALTMAN + CHATGPT [J5]", "ch": "THE CONVERSATION", "start": "2:43.530", "date": "30 Nov 2022", "status": "V", "img": "stills/_index_thumbs/C10_3.jpg", "fields": {"DATE": "30 November 2022 – OpenAI releases ChatGPT. A hundred million people are using it within two months, the fastest adoption of any consumer product to that point.", "WHAT": "Sam Altman at the desk, the chat window on the monitor – the Transformer, scaled and tuned, meeting the public as a conversation.", "WHERE": "OpenAI, San Francisco.", "WHAT WAS NEW": "The top rung of the instruction ladder: wiring, then language, then pointing, now CONVERSATION. Anyone who can type a sentence can instruct the machine; the interface is ordinary English.", "STAKES": "The distance from Hopper's console to this window closed in seventy-one years – and with it, the last special skill of the operator.", "THREAD": "The same chair, the same room, a different lab. → C10.4", "ON SCREEN": "AI-generated portrait of Altman in the J5 relation with the ChatGPT interface on screen – the anchor frame for the locked room the next two slides reuse."}, "heading": "CHATGPT · 30 November 2022"}, {"beat": "C10.4", "title": "AMODEI + CLAUDE [J5]", "ch": "THE CONVERSATION", "start": "2:46.840", "date": "14 Mar 2023", "status": "V", "img": "stills/_index_thumbs/C10_4.jpg", "fields": {"DATE": "14 March 2023 – Anthropic releases Claude.", "WHAT": "Dario Amodei – co-founder of Anthropic, formerly of OpenAI – in the identical chair, room and framing as the previous slide, with Claude on the monitor.", "WHERE": "Anthropic, San Francisco – founded by researchers who left over questions of safety and direction.", "WHAT WAS NEW": "Nothing – deliberately. The identical framing IS the argument: the same capability from a different lab. Not one company's decision but an industry's direction.", "STAKES": "Whoever sits in the chair, the machine on the desk is the same machine, and it is not stopping.", "THREAD": "Which raises the film's structural question. Every portrait since the Enigma has had someone in the chair. What happens to the frame when no one is? → C10.5", "ON SCREEN": "AI-generated portrait of Amodei, framed to match the Altman slide to the pixel – the repetition is the content."}, "heading": "CLAUDE · 14 March 2023"}, {"beat": "C10.5", "title": "THE EMPTY CHAIR · OpenClaw", "ch": "THE CONVERSATION", "start": "2:50.100", "date": "", "status": "", "img": "stills/_index_thumbs/C10_5.jpg", "fields": {"DATE": "None – the near present, and the near future.", "WHAT": "The J5 composition with NOBODY IN IT. The monitor glows with the mark of an autonomous agent; the work is visibly continuing.", "WHERE": "The same room every portrait has used since 1932.", "WHAT WAS NEW": "The seat every occupant of this film has filled is vacant – and nothing has stopped. The machine no longer needs the person in the frame.", "STAKES": "The hinge of the final act. From the Enigma operator to Amodei, a human has always been in that chair.", "THREAD": "An empty chair is an invitation. Something accepts it. → C13.0M", "ON SCREEN": "AI-generated: the empty chair, the desk, and the OpenClaw mark on the monitor. (The story notes record this beat as awaiting the real OpenClaw mark; the mark in the current plate stands in until that is settled.)"}, "heading": "THE EMPTY CHAIR · the work continues"}, {"beat": "C13.0M", "title": "MUSK · GROK · x.AI · SPACEX", "ch": "REACH", "start": "2:53.430", "date": "", "status": "", "img": "stills/_index_thumbs/C13_0M.jpg", "fields": {"DATE": "The mid-2020s – Grok and xAI (founded 2023), SpaceX's Starship era, Optimus in development.", "WHAT": "Elon Musk with three machines in one frame: the language model, the rocket, and the humanoid robot.", "WHERE": "xAI, SpaceX and Tesla – one person's span across software, launch and embodiment.", "WHAT WAS NEW": "Capability CONCENTRATED IN PRIVATE HANDS across every layer the film has followed – intelligence, reach and body – without a government in the frame.", "STAKES": "Sets up the reach chapter: the same person stands behind the model, the rocket and the constellation, which is why the orbital datacentre two slides on is not speculative.", "THREAD": "First the constellation. → C13.4", "ON SCREEN": "AI-generated composite portrait: Musk gesturing, Optimus beside him, the Grok interface behind, a Starship on the pad through the window."}, "heading": "MUSK · one man's machines"}, {"beat": "C13.4", "title": "SPACE DATA CENTERS", "ch": "REACH", "start": "2:56.700", "date": "2026", "status": "M", "img": "stills/_index_thumbs/C13_4.jpg", "fields": {"DATE": "2026 – orbital compute presented as a concept in Musk's SpaceX talk of August 2026; the film shows the buildout implied.", "WHAT": "A fleet of computing satellites in polar ranks over the ice, each a small equipment body between two enormous solar wings.", "WHERE": "A dawn–dusk sun-synchronous orbit, riding the terminator so the panels never lose the sun.", "WHAT WAS NEW": "The datacentre leaves the ground. Compute stops being a building on a floodplain – unbounded by land, grid, cooling water or planning permission.", "STAKES": "The growth curve escapes the planet's constraints. The intelligence's expansion is no longer obviously bounded by anything terrestrial.", "THREAD": "Reach outward is one direction. The other is inward, through the skull. → C13.3", "ON SCREEN": "Built, not generated whole: Mark placed all 76 satellites by hand over a generated polar Earth. Two knowing departures from literal truth, recorded in the story notes: the wings are turned toward the camera (edge-on truth would make them vanish), and real spacing – thousands of kilometres – is compressed so that \"there are thousands of these\" fits in one frame."}, "heading": "SPACE DATA CENTERS · 2026"}, {"beat": "C13.3", "title": "NEURALINK", "ch": "REACH", "start": "3:00.000", "date": "Jan 2024", "status": "V", "img": "stills/_index_thumbs/C13_3.jpg", "fields": {"DATE": "28 January 2024 – the first human receives Neuralink's N1 implant.", "WHAT": "A brain–computer interface: an implant whose threads read neural activity, letting its carrier – a man paralysed from the shoulders down – move a cursor, play chess, use a computer by thought.", "WHERE": "Surgery at the Barrow Neurological Institute, Phoenix.", "WHAT WAS NEW": "The interface moves INSIDE THE BODY. Instruction without hands – the ladder's rungs (wire, tell, point, converse) joined by a fifth that needs no muscle at all.", "STAKES": "The last barrier between human and machine is the skull, and here it is crossed voluntarily, to restore agency a body had lost.", "THREAD": "The interface is inside us. The machine, meanwhile, was preparing to come out of the screen entirely. → M.1", "ON SCREEN": "AI-generated: the crown of a man's head with the implant's components exploded above it in a clean technical stack. (Whether the first volunteer is named on the slide – Noland Arbaugh, who has told his story publicly – is an open ruling of Mark's, so this card leaves the frame anonymous.)"}, "heading": "NEURALINK · January 2024"}, {"beat": "M.1", "title": "THE EMPTY CHAIR [J5] · Optimus chest-up INSIDE the monitor", "ch": "REACH", "start": "3:03.290", "date": "", "status": "", "img": "stills/_index_thumbs/M_1.jpg", "fields": {"DATE": "None – from here to the end, the film is ahead of the news.", "WHAT": "The empty chair again – but now Optimus is INSIDE the monitor, chest-up, occupying the composition every human portrait has used since the Enigma.", "WHERE": "The J5 room.", "WHAT WAS NEW": "The machine takes the POSE before it takes the room. The frame that held Turing, Hopper, Wozniak, Jobs, Altman and Amodei now contains the machine's own image.", "STAKES": "Seventeen chapters of humans in that rectangle, answered by one occupant who is not one.", "THREAD": "An image on a screen is still only an image. Then it reaches the screen's edge. → M.1B", "ON SCREEN": "AI-generated: desk, empty chair, and the robot framed inside the monitor exactly as every portrait was framed – the film's compositional payoff armed."}, "heading": "THE MACHINE IN THE FRAME · near future"}, {"beat": "M.1B", "title": "OPTIMUS CRAWLS OUT OF THE COMPUTER", "ch": "INTELLIGENCE TAKES A BODY", "start": "3:05.850", "date": "", "status": "", "img": "stills/_index_thumbs/M_1B.jpg", "fields": {"DATE": "None.", "WHAT": "Optimus coming OUT of the screen – hands and shoulders breaching the plane that has separated machine from room for the whole film.", "WHERE": "The J5 room, mid-crossing.", "WHAT WAS NEW": "Software becoming hardware. The intelligence stops being a picture of itself and acquires the one thing it lacked: presence.", "STAKES": "Everything before this was on a screen. Everything after is in the room.", "THREAD": "The crossing completes. → M.1C", "ON SCREEN": "AI-generated: the robot's upper body breaking the screen plane – one continuous take across the three M.1 windows."}, "heading": "THE BREAKOUT · near future"}, {"beat": "M.1C", "title": "OPTIMUS IN THE ROOM · the breakout completes", "ch": "INTELLIGENCE TAKES A BODY", "start": "3:08.428", "date": "", "status": "", "img": "stills/_index_thumbs/M_1C.jpg", "fields": {"DATE": "None.", "WHAT": "Optimus standing upright in the room, the screen dark behind him. The breakout is finished.", "WHERE": "The J5 room – no longer as an image in it, but as a body.", "WHAT WAS NEW": "The crossing is complete. What was an image is standing on the floor.", "STAKES": "The film gave this beat its own window by striking the Senate hearing – a ruling that the crossing mattered more than the deliberation about it.", "THREAD": "A machine in the room can be met. Face to face. → C14.3", "ON SCREEN": "AI-generated: the robot upright beside the dead monitor – the third window of one continuous take."}, "heading": "IN THE ROOM · near future"}, {"beat": "C14.3", "title": "FACE TO FACE · equal height", "ch": "THE MACHINE LEAVES THE SCREEN", "start": "3:10.616", "date": "", "status": "", "img": "stills/_index_thumbs/C14_3.jpg", "fields": {"DATE": "None.", "WHAT": "An ordinary person and the machine, standing at equal height, facing each other. Nothing else happens.", "WHERE": "An industrial hall at night – any workplace.", "WHAT WAS NEW": "The confrontation returned to HUMAN PROPORTIONS. After warehouses, cars, swarms and constellations, the encounter is finally one person's.", "STAKES": "Quiet and unresolved, deliberately. The film refuses the spectacle here because the next slides raise the real questions.", "THREAD": "What do we hand it first? The answer the film gives is the most intimate thing there is. → C15.4", "ON SCREEN": "AI-generated: man and machine in profile, equal scale, a metre apart – the film's presence-gradient at its point of balance one last time."}, "heading": "FACE TO FACE · near future"}, {"beat": "C15.4", "title": "THE MATERNITY WARD", "ch": "THE MACHINE LEAVES THE SCREEN", "start": "3:14.250", "date": "", "status": "", "img": "stills/_index_thumbs/C15_4.jpg", "fields": {"DATE": "None.", "WHAT": "Machine hands receiving a newborn, the mother watching from the bed, a hum const FIELDS = ["DATE", "WHAT", "WHERE", "WHAT WAS NEW", "STAKES", "THREAD", "ON SCREEN"];
let i = 0;
const strip = document.getElementById('strip');
// Decade markers (Mark 2026-08-30): label the tick where the timeline first
// enters each new decade. Slides sit in cut order, not year-proportional, and
// one beat deliberately steps back (the 1947 transistor after Apollo), so the
// labels advance monotonically - a decade is marked once, at its first arrival.
let lastDecade = 0;
SLIDES.forEach((s, k) => {
  const t = document.createElement('div');
  t.className = 'tick' + (s.date ? ' dated' : '');
  t.style.left = (100 * k / (SLIDES.length - 1)) + '%';
  let inner = '<span class="lbl">' + (s.date || '') + '</span>';
  const ym = (s.date || '').match(/(\d{4})\s*$/);
  if (ym) {
    const dec = Math.floor(parseInt(ym[1], 10) / 10) * 10;
    if (dec > lastDecade) { lastDecade = dec; inner += '<span class="dec">' + dec + '</span>'; }
  }
  t.innerHTML = inner;
  t.onclick = (ev) => { ev.stopPropagation(); show(k); };
  strip.appendChild(t);
});
// Click anywhere on the strip - not just a tick - to jump to the nearest slide.
strip.addEventListener('click', (e) => {
  const r = strip.getBoundingClientRect();
  const f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  show(Math.round(f * (SLIDES.length - 1)));
});
const ticks = strip.querySelectorAll('.tick');
function show(k) {
  i = Math.max(0, Math.min(SLIDES.length - 1, k));
  const s = SLIDES[i];
  document.getElementById('imgwrap').innerHTML = s.img
    ? '<img src="' + s.img + '" alt="">'
    : '<div class="noimg">no image cached for ' + s.beat + '</div>';
  document.getElementById('bigdate').textContent = s.date || '\u2014';
  const mmss = (s.start || '').split('.')[0];
  document.getElementById('slidetitle').textContent =
    mmss + ' \u00b7 ' + s.beat + ' \u00b7 ' + s.title;
  let h = '';
  if (s.fields) {
    h += '<h2>' + mmss + ' \u00b7 ' + (s.heading || s.title) + '</h2>';
    for (const f of FIELDS) {
      if (s.fields[f]) h += '<div class="fld"><b>' + f + '</b>' + s.fields[f] + '</div>';
    }
  } else {
    h += '<h2>' + s.title + '</h2>' +
         '<p class="placeholder">Story card not yet written for ' + s.beat +
         ' \u2013 add it to STORY_CARDS and rebuild.</p>';
  }
  document.getElementById('story').innerHTML = h;
  document.getElementById('pos').textContent = (i + 1) + ' / ' + SLIDES.length;
  ticks.forEach((t, k2) => t.classList.toggle('on', k2 === i));
}
document.getElementById('prev').onclick = () => show(i - 1);
document.getElementById('next').onclick = () => show(i + 1);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') show(i - 1);
  if (e.key === 'ArrowRight') show(i + 1);
});
show(0);
